baseURL = 'https://thepragmaticengineer.com/'
theme = 'PaperMod'
paginate = 10
defaultContentLanguage = 'en'
enableEmoji = true

[params]
  author = 'Cristian'
  description = 'A _Software engineer sharing studies, knowledge, and ideas with the community.'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false

[[params.socialIcons]]
  name = 'github'
  url  = 'https://github.com/cristiantcjti'

[languages]

  [languages.en]
    languageCode  = 'en-us'
    languageName  = 'English'
    weight        = 1
    title         = 'The Pragmatic Engineer'

    [languages.en.params.homeInfoParams]
      Title   = '_Software Engineering is an Art_'
      Content = '_Software engineer sharing studies, notes, knowledge and real life with the community. Check out the blog posts and if I can contribute somehow with you, the blog will be successfully archived its purpose._'

    [[languages.en.menu.main]]
      name   = 'About'
      url    = '/about/'
      weight = 1

    [[languages.en.menu.main]]
      name   = 'Blog'
      url    = '/posts/'
      weight = 2

  [languages.pt]
    languageCode  = 'pt-br'
    languageName  = 'Português'
    weight        = 2
    title         = 'The Pragmatic Engineer'

    [languages.pt.params.homeInfoParams]
      Title   = 'Olá, eu sou o Cristian'
      Content = 'Engenheiro backend compartilhando estudos, notas e conhecimento com a comunidade.'

    [[languages.pt.menu.main]]
      name   = 'Sobre'
      url    = '/pt/about/'
      weight = 1

    [[languages.pt.menu.main]]
      name   = 'Blog'
      url    = '/pt/posts/'
      weight = 2

[markup.highlight]
  style     = 'monokai'
  lineNos   = false
  noClasses = false
